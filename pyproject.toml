[project]
# Distribution name on PyPI. `nona` is taken (build plan Q1); the import name and the command stay `nona`.
name = "nona-proxy"
version = "0.0.1"
description = "Local proxy that pseudonymizes personal data before it reaches an LLM, and restores it in the answer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Yosr Kharrat" }]
keywords = ["pii", "privacy", "llm", "proxy", "anonymization", "darija", "arabizi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
# Runtime dependencies are added in the milestone that needs them (see README roadmap):
# M1 detection (phonenumbers, gliner), M3 proxy (fastapi, uvicorn, httpx).
dependencies = [
    "phonenumbers>=8.13",
]

[project.scripts]
nona = "nona.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nona"]

# ---------------------------------------------------------------- quality

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]  # docs/diagrams/generate.py is a drawing script, not product code

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax
    "B",             # bugbear
    "SIM",           # simplifications
    "N",             # naming
    "S",             # bandit security checks
    "PT",            # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test
# Arabic letters that look like Latin ones (alef, heh) are intended in this name table.
"src/nona/core/canonical.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src/nona/core"]  # NFR-10: strict typing on the core library

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "e2e: end-to-end tests that need a running upstream (Ollama)",
]

[tool.coverage.run]
source = ["nona"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
