name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  model:
    name: Model tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a stalled Hub download must not hold the check for GitHub's 6 hours
    env:
      NONA_MODELS_DIR: ${{ github.workspace }}/.models
      NONA_MODEL_TESTS: required  # fail instead of skipping when the model is missing (tests/model)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-suffix: ner  # its own uv cache, with torch; the other jobs install without the extra
      - run: uv sync --locked --extra ner
      # Keyed on every pinned repo, revision and file hash: a new pin downloads once, then hits the cache.
      - id: pins
        run: |
          key=$(uv run python -c "import hashlib; from nona.models import PINNED as P; print('-'.join(r.folder for r in P.repos) + '-' + hashlib.sha256(repr(P).encode()).hexdigest()[:16])")
          echo "key=nona-models-$key" >> "$GITHUB_OUTPUT"
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: ${{ steps.pins.outputs.key }}
      # On a cache hit this downloads nothing, but still checks every file against its pinned SHA-256:
      # a cache entry that doesn't match is replaced, never loaded.
      - run: uv run nona models pull
      # Saved once verified, before the tests: a failing test doesn't make the next run download 1.2 GB again.
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: ${{ steps.pins.outputs.key }}
      - run: uv run pytest -m model

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Audit exactly what uv.lock pins (with hashes), without letting pip resolve anything.
      # --all-extras: the optional `ner` extra (torch, transformers) runs on every prompt too.
      # On Linux, torch comes from the PyTorch CPU index as `2.15.0+cpu`, a local build of the public release
      # that PyPI doesn't list. Strip the local label so it's audited under its public version.
      - run: |
          set -o pipefail
          uv export --locked --all-extras --format requirements-txt --no-emit-project \
            | sed -E 's/^([A-Za-z0-9_.-]+==[^ ;+]+)\+[A-Za-z0-9.]+/\1/' > requirements-audit.txt
          grep -q '^torch==' requirements-audit.txt
      - run: uvx pip-audit==2.10.1 --strict --disable-pip -r requirements-audit.txt
