name: Bug
description: Something does not behave as the design docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real personal data here**, not even "anonymized". Reproduce with synthetic values
        (names you made up, `example.com` emails, test card numbers).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (synthetic data only)
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (`nona --version`) and OS
  - type: dropdown
    id: leak
    attributes:
      label: Did personal data reach the upstream LLM?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
