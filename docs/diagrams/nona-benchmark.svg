<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 620" width="1720" height="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><defs><marker id="e-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="e-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="e-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="1720" height="620" fill="#ffffff"/><text x="40" y="54.599999999999994" font-size="28" fill="#1e1e1e" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">Nona: benchmark harness (nona bench)</tspan></text><text x="40" y="84.25" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">every system gets the same messages · we score what reaches the upstream, not what the detector reports</tspan></text><rect x="40" y="170" width="270" height="170" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="175.0" y="218.6" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="175.0" dy="0">synthetic dataset</tspan><tspan x="175.0" dy="16.25">FR · EN · AR · Darija</tspan><tspan x="175.0" dy="16.25">Arabizi · mixed</tspan><tspan x="175.0" dy="16.25"> </tspan><tspan x="175.0" dy="16.25">dev: tune thresholds</tspan><tspan x="175.0" dy="16.25">test: FROZEN, hash in repo</tspan></text><text x="40" y="361.4" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">templates + generators →</tspan><tspan x="40" dy="15.0">gold labels by construction</tspan><tspan x="40" dy="15.0">+ ~50 hand-written hard cases</tspan><tspan x="40" dy="15.0">NO real or client data</tspan></text><rect x="380" y="130" width="280" height="290" rx="10" fill="none" stroke="#868e96" stroke-width="2"/><text x="392" y="152.35" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="392" dy="0">systems under test</tspan></text><rect x="400" y="165" width="240" height="60" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="520.0" y="191.1" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="520.0" dy="0">Nona</tspan><tspan x="520.0" dy="16.25">(release config)</tspan></text><rect x="400" y="240" width="240" height="75" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="520.0" y="265.475" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="520.0" dy="0">Presidio</tspan><tspan x="520.0" dy="16.25">① default (EN)</tspan><tspan x="520.0" dy="16.25">② FR spaCy + patterns</tspan></text><rect x="400" y="330" width="240" height="60" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="520.0" y="356.1" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="520.0" dy="0">LLM Guard</tspan><tspan x="520.0" dy="16.25">Anonymize, default</tspan></text><polyline points="310,255 380,255" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="740" y="170" width="250" height="120" rx="10" fill="none" stroke="#e03131" stroke-width="2"/><text x="865.0" y="209.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="865.0" dy="0">capturing mock upstream</tspan><tspan x="865.0" dy="16.25">records the exact payload</tspan><tspan x="865.0" dy="16.25">that would leave the</tspan><tspan x="865.0" dy="16.25">machine (the wire)</tspan></text><polyline points="660,230 740,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="740" y="340" width="250" height="120" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/><text x="865.0" y="371.725" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="865.0" dy="0">utility run</tspan><tspan x="865.0" dy="16.25">same tasks, raw vs</tspan><tspan x="865.0" dy="16.25">through each system</tspan><tspan x="865.0" dy="16.25">Ollama in CI · hosted</tspan><tspan x="865.0" dy="16.25">model for README</tspan></text><polyline points="660,380 740,380" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="1070" y="130" width="300" height="330" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1220.0" y="217.975" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1220.0" dy="0">metrics</tspan><tspan x="1220.0" dy="16.25"> </tspan><tspan x="1220.0" dy="16.25">LEAK RATE (headline)</tspan><tspan x="1220.0" dy="16.25">partial leak rate</tspan><tspan x="1220.0" dy="16.25">over-masking rate</tspan><tspan x="1220.0" dy="16.25">restoration failure</tspan><tspan x="1220.0" dy="16.25">utility loss ± 95% CI</tspan><tspan x="1220.0" dy="16.25">(extract · reply · sum.)</tspan><tspan x="1220.0" dy="16.25">overhead p50 / p95</tspan><tspan x="1220.0" dy="16.25"> </tspan><tspan x="1220.0" dy="16.25">per language × type</tspan></text><polyline points="990,230 1070,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="990,400 1070,400" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="175,420 175,520 1220,520 1220,4