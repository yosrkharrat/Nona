<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 910" width="1740" height="910" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><defs><marker id="e-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="e-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="e-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="1740" height="910" fill="#ffffff"/><text x="40" y="54.599999999999994" font-size="28" fill="#1e1e1e" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">Nona: container view (v0.1)</tspan></text><text x="40" y="84.25" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">one local process · anonymize on the way out · restore on the way back · nothing stored after the response</tspan></text><rect x="40" y="120" width="1300" height="760" rx="10" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="143.3" font-size="14" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="52" dy="0">TRUSTED ZONE: your machine / VPC (real data allowed here)</tspan></text><rect x="70" y="400" width="210" height="110" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="175.0" y="441.125" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="175.0" dy="0">client app</tspan><tspan x="175.0" dy="18.75">(OpenAI SDK)</tspan><tspan x="175.0" dy="18.75">base_url → :8787</tspan></text><text x="70" y="537.35" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="70" dy="0">the only code change.</tspan><tspan x="70" dy="16.25">gets real names back.</tspan></text><rect x="310" y="160" width="1000" height="700" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="322" y="184.25" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="bold"><tspan x="322" dy="0">nona serve: one Python process (FastAPI + uvicorn)</tspan></text><rect x="330" y="230" width="140" height="470" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="400.0" y="379.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="400.0" dy="0">API layer</tspan><tspan x="400.0" dy="16.25"> </tspan><tspan x="400.0" dy="16.25">/v1/chat/</tspan><tspan x="400.0" dy="16.25">completions</tspan><tspan x="400.0" dy="16.25"> </tspan><tspan x="400.0" dy="16.25">/v1/models</tspan><tspan x="400.0" dy="16.25">/healthz</tspan><tspan x="400.0" dy="16.25">/metrics</tspan><tspan x="400.0" dy="16.25"> </tspan><tspan x="400.0" dy="16.25">/v1/nona/*</tspan><tspan x="400.0" dy="16.25">(inspect,</tspan><tspan x="400.0" dy="16.25"> localhost)</tspan></text><text x="490" y="218.3" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="bold"><tspan x="490" dy="0">① request path: anonymize</tspan></text><rect x="490" y="235" width="112" height="80" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="546.0" y="271.1" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="546.0" dy="0">walk</tspan><tspan x="546.0" dy="16.25">payload</tspan></text><rect x="622" y="235" width="112" height="80" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="678.0" y="262.975" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="678.0" dy="0">normalize</tspan><tspan x="678.0" dy="16.25">Arabizi 3→ع</tspan><tspan x="678.0" dy="16.25">offset map</tspan></text><rect x="754" y="235" width="112" height="80" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="810.0" y="262.975" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="810.0" dy="0">detect</tspan><tspan x="810.0" dy="16.25">(union,</tspan><tspan x="810.0" dy="16.25">recall first)</tspan></text><rect x="886" y="235" width="112" height="80" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="942.0" y="262.975" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="942.0" dy="0">resolve</tspan><tspan x="942.0" dy="16.25">+ link</tspan><tspan x="942.0" dy="16.25">mentions</tspan></text><rect x="1018" y="235" width="112" height="80" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="1074.0" y="262.975" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1074.0" dy="0">pseudonymize</tspan><tspan x="1074.0" dy="16.25">TYPE_n by</tspan><tspan x="1074.0" dy="16.25">1st appear.</tspan></text><polyline points="470,275 490,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="602,275 622,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="734,275 754,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="866,275 886,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="998,275 1018,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="490" y="350" width="370" height="190" rx="10" fill="none" stroke="#868e96" stroke-width="2"/><text x="502" y="372.35" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="502" dy="0">detectors (in-process, offline)</tspan></text><rect x="502" y="380" width="168" height="68" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="586.0" y="402.9" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="586.0" dy="0">regex + checksum</tspan><tspan x="586.0" dy="15.0">email · phone</tspan><tspan x="586.0" dy="15.0">IBAN · CIN(ctx)</tspan></text><rect x="680" y="380" width="168" height="68" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="764.0" y="402.9" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="764.0" dy="0">GLiNER multi</tspan><tspan x="764.0" dy="15.0">CPU · weights</tspan><tspan x="764.0" dy="15.0">pulled once</tspan></text><rect x="502" y="458" width="168" height="68" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="586.0" y="480.9" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="586.0" dy="0">gazetteers +</tspan><tspan x="586.0" dy="15.0">context cues</tspan><tspan x="586.0" dy="15.0">m3a · khalti · M.</tspan></text><rect x="680" y="458" width="168" height="68" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="764.0" y="480.9" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="764.0" dy="0">detection cache</tspan><tspan x="764.0" dy="15.0">LRU+TTL, RAM</tspan><tspan x="764.0" dy="15.0">spans only</tspan></text><polyline points="810,315 810,350" fill="none" stroke="#1e1e1e" stroke-width="2" marker-start="url(#s-ink)" marker-end="url(#e-ink)"/><rect x="886" y="365" width="244" height="150" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="1008.0" y="406.4" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1008.0" dy="0">MAPPING (per request)</tspan><tspan x="1008.0" dy="15.0">PERSON_1 ↔ Ahmed Ben Salem</tspan><tspan x="1008.0" dy="15.0">PHONE_1  ↔ +216 22 123 456</tspan><tspan x="1008.0" dy="15.0"> </tspan><tspan x="1008.0" dy="15.0">RAM only · dropped after</tspan><tspan x="1008.0" dy="15.0">the response (ADR-0002)</tspan></text><polyline points="1074,315 1074,365" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><text x="1080" y="341.4" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="1080" dy="0">write</tspan></text><rect x="1160" y="230" width="130" height="470" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1225.0" y="428.6" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1225.0" dy="0">upstream</tspan><tspan x="1225.0" dy="16.25">client</tspan><tspan x="1225.0" dy="16.25"> </tspan><tspan x="1225.0" dy="16.25">httpx async</tspan><tspan x="1225.0" dy="16.25">pooled</tspan><tspan x="1225.0" dy="16.25">SSE stream</tspan></text><polyline points="1130,275 1160,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><text x="490" y="603.3" font-size="14" fill="#2f9e44" text-anchor="start" font-weight="bold"><tspan x="490" dy="0">② response path: restore</tspan></text><rect x="490" y="620" width="640" height="80" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/><text x="810.0" y="648.9" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="810.0" dy="0">restore: streaming state machine</tspan><tspan x="810.0" dy="15.0">holds back ≤16 chars that could start a placeholder</tspan><tspan x="810.0" dy="15.0">swaps only placeholders issued in this request · JSON-escapes tool_call args</tspan></text><polyline points="1160,660 1130,660" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="490,660 470,660" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="1010,515 1010,620" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><text x="1016" y="571.4" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="1016" dy="0">read</tspan></text><polyline points="280,430 330,430" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="330,480 280,480" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><text x="70" y="372.35" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal"><tspan x="70" dy="0">→ real data in</tspan><tspan x="70" dy="16.25">← restored answer out</tspan></text><rect x="330" y="725" width="500" height="115" rx="10" fill="none" stroke="#e03131" stroke-width="2"/><text x="580.0" y="762.35" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal"><tspan x="580.0" dy="0">FAIL CLOSED (ADR-0003)</tspan><tspan x="580.0" dy="16.25">detector error or timeout → HTTP 503</tspan><tspan x="580.0" dy="16.25">nona_detector_unavailable</tspan><tspan x="580.0" dy="16.25">nothing is forwarded upstream</tspan></text><rect x="850" y="725" width="440" height="115" rx="10" fill="none" stroke="#868e96" stroke-width="2"/><text x="1070.0" y="762.35" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1070.0" dy="0">side channels</tspan><tspan x="1070.0" dy="16.25">config: nona.yaml (policies, allow/deny)</tspan><tspan x="1070.0" dy="16.25">logs + /metrics: counts &amp; timings only,</tspan><tspan x="1070.0" dy="16.25">never bodies (FR-19 CI grep test)</tspan></text><rect x="1480" y="400" width="220" height="110" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1590.0" y="441.125" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1590.0" dy="0">upstream LLM</tspan><tspan x="1590.0" dy="18.75">OpenAI · OpenRouter</tspan><tspan x="1590.0" dy="18.75">Ollama</tspan></text><text x="1480" y="312.35" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="1480" dy="0">UNTRUSTED</tspan><tspan x="1480" dy="16.25">honest but curious:</tspan><tspan x="1480" dy="16.25">logs, training,</tspan><tspan x="1480" dy="16.25">subprocessors</tspan></text><polyline points="1290,430 1480,430" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="1480,480 1290,480" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><text x="1352" y="409.4" font-size="12" fill="#1e1e1e" text-anchor="start" font-weight="normal"><tspan x="1352" dy="0">placeholders</tspan><tspan x="1352" dy="15.0">only</tspan></text><text x="1352" y="499.4" font-size="12" fill="#1e1e1e" text-anchor="start" font-weight="normal"><tspan x="1352" dy="0">PERSON_1</tspan><tspan x="1352" dy="15.0">in deltas</tspan></text><text x="1360" y="557.35" font-size="13" fill="#e03131" text-anchor="start" font-weight="bold"><tspan x="1360" dy="0">◆ LEAK RATE is measured on</tspan><tspan x="1360" dy="16.25">  this outbound wire: what</tspan><tspan x="1360" dy="16.25">  actually leaves, not what</tspan><tspan x="1360" dy="16.25">  the detector thinks it caught</tspan></text></svg>