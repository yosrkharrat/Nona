<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 730" width="1750" height="730" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><defs><marker id="e-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="e-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="e-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><rect width="1750" height="730" fill="#ffffff"/><text x="40" y="54.599999999999994" font-size="28" fill="#1e1e1e" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">Nona: release &amp; deployment (ADR-0007)</tspan></text><text x="40" y="84.25" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">built only in CI · signed and attested · you verify before you run it</tspan></text><rect x="40" y="150" width="240" height="120" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="160.0" y="189.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="160.0" dy="0">release-please PR</tspan><tspan x="160.0" dy="16.25">version + CHANGELOG</tspan><tspan x="160.0" dy="16.25">from Conventional</tspan><tspan x="160.0" dy="16.25">Commits · merge → tag</tspan></text><rect x="340" y="150" width="340" height="210" rx="10" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/><text x="510.0" y="210.475" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="510.0" dy="0">GitHub Actions: release job</tspan><tspan x="510.0" dy="16.25"> </tspan><tspan x="510.0" dy="16.25">actions pinned by commit SHA</tspan><tspan x="510.0" dy="16.25">no caches (ultralytics lesson)</tspan><tspan x="510.0" dy="16.25">short-lived OIDC tokens,</tspan><tspan x="510.0" dy="16.25">no stored secrets</tspan><tspan x="510.0" dy="16.25">only this job may publish</tspan></text><polyline points="280,210 340,210" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="760" y="130" width="300" height="100" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="910.0" y="167.975" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="910.0" dy="0">wheel + sdist → PyPI</tspan><tspan x="910.0" dy="16.25">Trusted Publishing (OIDC)</tspan><tspan x="910.0" dy="16.25">PEP 740 attestations</tspan></text><rect x="760" y="260" width="300" height="120" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="910.0" y="299.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="910.0" dy="0">image → ghcr.io/&lt;owner&gt;/nona</tspan><tspan x="910.0" dy="16.25">linux/amd64 + linux/arm64</tspan><tspan x="910.0" dy="16.25">CPU-only · non-root</tspan><tspan x="910.0" dy="16.25">pinned model baked in</tspan></text><polyline points="680,180 760,180" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="680,320 760,320" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="1140" y="150" width="280" height="210" rx="10" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/><text x="1280.0" y="202.35" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1280.0" dy="0">signed + attested</tspan><tspan x="1280.0" dy="16.25"> </tspan><tspan x="1280.0" dy="16.25">cosign keyless (Sigstore)</tspan><tspan x="1280.0" dy="16.25">SLSA build provenance</tspan><tspan x="1280.0" dy="16.25">CycloneDX SBOM (syft)</tspan><tspan x="1280.0" dy="16.25"> </tspan><tspan x="1280.0" dy="16.25">identity = this repo&#x27;s</tspan><tspan x="1280.0" dy="16.25">release workflow</tspan></text><polyline points="1060,180 1140,180" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><polyline points="1060,320 1140,320" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="1490" y="190" width="220" height="130" rx="10" fill="none" stroke="#e03131" stroke-width="2"/><text x="1600.0" y="236.4" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1600.0" dy="0">YOU, before running:</tspan><tspan x="1600.0" dy="15.0">cosign verify ghcr.io/…</tspan><tspan x="1600.0" dy="15.0">gh attestation verify</tspan><tspan x="1600.0" dy="15.0">(both in the README)</tspan></text><polyline points="1420,255 1490,255" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><rect x="40" y="400" width="640" height="55" rx="10" fill="none" stroke="#868e96" stroke-width="2"/><text x="360.0" y="423.6" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="360.0" dy="0">every PR: ruff · pyright · pytest 3.11–3.13 · pip-audit · CodeQL</tspan><tspan x="360.0" dy="16.25">weekly: OpenSSF Scorecard · Dependabot bumps action pins and uv.lock</tspan></text><polyline points="160,400 160,270" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#e-gray)"/><text x="168" y="341.4" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="168" dy="0">gates every</tspan><tspan x="168" dy="15.0">merge to main</tspan></text><rect x="300" y="490" width="1120" height="200" rx="10" fill="none" stroke="#868e96" stroke-width="2"/><text x="312" y="512.35" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="312" dy="0">run it (03 §8)</tspan></text><rect x="320" y="530" width="320" height="130" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="480.0" y="574.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="480.0" dy="0">laptop</tspan><tspan x="480.0" dy="16.25">pip install nona</tspan><tspan x="480.0" dy="16.25">nona models pull · nona serve</tspan><tspan x="480.0" dy="16.25">binds 127.0.0.1:8787</tspan></text><rect x="660" y="530" width="340" height="130" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="830.0" y="574.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="830.0" dy="0">docker compose</tspan><tspan x="830.0" dy="16.25">nona + Grafana LGTM dashboard</tspan><tspan x="830.0" dy="16.25">(ADR-0005)</tspan><tspan x="830.0" dy="16.25">+ Valkey for stateful mode</tspan></text><rect x="1020" y="530" width="380" height="130" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/><text x="1210.0" y="574.85" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal"><tspan x="1210.0" dy="0">Kubernetes (Helm chart)</tspan><tspan x="1210.0" dy="16.25">sidecar: app → http://nona:8787/v1</tspan><tspan x="1210.0" dy="16.25">gateway: N replicas share the</tspan><tspan x="1210.0" dy="16.25">Redis session store (ADR-0006)</tspan></text><polyline points="1600,320 1600,590 1420,590" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#e-ink)"/><text x="40" y="532.35" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">verification is part of</tspan><tspan x="40" dy="16.25">the install docs, not an</tspan><tspan x="40" dy="16.25">afterthought</tspan></text></svg>